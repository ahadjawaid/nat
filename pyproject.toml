[project]
name = "nat-tokenizer"
version = "0.1.0"
description = "NAT action tokenizer: robot action chunks to time-ordered discrete tokens and back"
authors = [{ name = "Ahad Jawaid" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "torch>=2", "huggingface_hub>=0.20"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat_tokenizer"]
